[project]
# All relative paths are resolved from this config file location.
output_dir = results

[gait]
# Put walking videos here if you want this package to call MMPose.
video_dir = data/gait_videos

# MMPose keypoint JSON output folder. If you already have JSON files, put them here
# and set run_mmpose = no.
keypoint_json_dir = results/gait_keypoints/json_flat
run_mmpose = no

# Command-template mode keeps this public package independent of a specific MMPose
# installation. Use {video_dir}, {keypoint_json_dir}, or per-video {video}.
# Example for an existing batch script:
# mmpose_command_template = bash batch_mmpose.sh "{video_dir}" "{keypoint_json_dir}"
# Example for official MMPose inferencer, adjust to your local MMPose version:
# mmpose_command_template = python demo/inferencer_demo.py "{video}" --pose2d human --bbox-thr 0.3 --pred-out-dir "{keypoint_json_dir}"
mmpose_command_template =
mmpose_use_shell = no
video_extensions = .mp4,.mov,.avi,.mkv

# Gait feature extraction settings.
frame_rate = 30
distance_meters = 6
group = AD
min_keypoint_score = 0.2
smooth_window = 5
interp_max_gap = 10
min_stride_time_sec = 0.4
camera_calib_npz =

gait_without_ds_json = results/gait_features/gait_without_ds.json
gait_ds_json = results/gait_features/gait_ds.json
write_check_previous_xlsx = yes
gait_features_xlsx = results/gait_features/gait_features_check_previous_format.xlsx

# Optional QC on a check_previous-format xlsx file.
gait_xlsx_for_qc = results/gait_features/gait_features_check_previous_format.xlsx
gait_qc_xlsx = results/gait_features/gait_qc_report.xlsx

[speech]
# TASK08 = single speech task, TASK09 = dual speech task in the current workflow.
task8_audio_dir = data/speech_audio/task8
task9_audio_dir = data/speech_audio/task9
task8_asr_dir = results/speech_asr/task8
task9_asr_dir = results/speech_asr/task9
run_whisperx = no

model_name = large-v2
language = zh
compute_type = float16

first_five = 93,86,79,72,65
task8_features_json = results/speech_features/task8_features.json
task9_features_json = results/speech_features/task9_features.json

[experiment]
# These files are not included because they contain study data.
demo_xlsx = data/demo.xlsx
gait_xlsx = results/gait_features/gait_features_check_previous_format.xlsx
task8_json = results/speech_features/task8_features.json
task9_json = results/speech_features/task9_features.json
out_dir = results/experiments
target = MoCA
max_selected_features = 3
top_candidates = 6

[paper_experiment]
# Input table matching the manuscript modeling sheet. It should contain ID, label,
# age, edu, DT speech features, and gait features. The historical local script used
# sheet_name = age-edu in new_all.xlsx.
input_table = data/paper_modeling_dataset.xlsx
sheet_name = age-edu
out_dir = results/paper_experiments
label_col = label
id_col = ID

# nestedselected follows the top-14 training-fold frequency panel from nested
# feature selection. adualselected remains available for historical re-analysis:
# {v1, v10, v12, v13, v16, a1-a7, edu, age}.
# script_all follows the 25-feature list in xp_hand_vi_au_250819.py.
feature_set = nestedselected
custom_features =
n_splits = 5
n_repeats = 10
run_train_test_split = yes
run_publication_outputs = yes
run_confounder_adjustment = yes
run_nested_feature_selection = yes
promote_nested_selection = yes
publication_models = AdaBoost,RF,SVM (RBF),DT
nested_candidate_set = script_all
nested_custom_features =
nested_select_k = 14
train_test_repeats = 100
test_size = 0.2
bootstrap_repeats = 2000
bootstrap_ci = 0.95
age_col = age
education_col = edu
sex_col =
auroc_stability_margin = 0.02
use_robust = no
run_shap = yes
run_regression = yes
regression_target = MoCA
shap_models = GBDT,Random Forest,Logistic Regression
roc_models = GBDT,Random Forest,Logistic Regression,SVM (RBF)
max_shap_display = 20

[domain_ablation]
# Full-cohort within-task domain ablation. This uses only the same dual-task
# TUG-DT modeling table, not single-task or external-validation data.
input_table = data/paper_modeling_dataset.xlsx
sheet_name = age-edu
out_dir = results/domain_ablation
label_col = label
id_col = ID
n_splits = 5
n_repeats = 10
select_k_cap = 14
publication_models = AdaBoost,RF,SVM (RBF),DT
bootstrap_repeats = 2000
bootstrap_ci = 0.95
use_robust = no

[figures]
# Fig. 4 requires both domain-ablation outputs and paper-experiment outputs.
domain_results_dir = results/domain_ablation
paper_results_dir = results/paper_experiments
out_dir = results/figures
fig4_stem = fig4_model_contribution_interpretability
domain_model = AdaBoost
bootstrap_repeats = 5000
bootstrap_ci = 0.95

[statistics]
# Python-only replacement for the historical R baseline/group/correlation scripts.
input_table = data/paper_modeling_dataset.xlsx
sheet_name = age-edu
out_dir = results/statistical_analysis
label_col = label
id_col = ID
group_col = label
group_map = 0:CU,1:CI
group_order = CU,CI
baseline_continuous = MMSE,MoCA,edu,age
categorical_vars = gender
feature_cols =
correlation_cols = ACC_DT,Correct_persec_DT,Correct_Num_DT,Num_DT,Timecount_DT,Timecount_DT_1stNum,Num_20s_DT,Correct_Num_20s_DT,average_step_length,average_stride_length,step_length_variability,stride_length_variability,average_step_time,average_stride_time,step_time_variability,stride_time_variability,average_step_assymetry,average_stride_assymetry,walking_speed,cadence,stance_times,swing_times,double_support_times,age,edu,MMSE,MoCA
alpha = 0.05
outlier_thr = 0.02
top_boxplot_features = 12
max_corr_vars = 12
